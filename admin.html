<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Admin — UIPACT</title>
<link rel="icon" href="logo.png">
<style>
:root{--gold:#C9A24B;--gold2:#E4C77A;--navy:#101B3D;--bg:#0A1024;--panel:#111A38;--panel2:#16204A;--line:rgba(201,162,75,.25);--mut:#9A9CAA}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:radial-gradient(circle at 12% -5%,rgba(201,162,75,.13),transparent 42%),var(--bg);color:#EDEAE0;font:15px/1.55 Inter,system-ui,sans-serif}
a{color:var(--gold2)}input,textarea,select,button{font:inherit;color:inherit}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid rgba(201,162,75,.3);border-radius:12px;padding:10px 13px;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.2)}textarea{resize:vertical}
input[type=color]{padding:2px;height:42px;width:70px}input[type=checkbox]{width:auto;accent-color:var(--gold)}
button{cursor:pointer;border:1px solid rgba(201,162,75,.5);background:transparent;border-radius:12px;padding:9px 15px;transition:.2s}button:hover{background:rgba(201,162,75,.15)}
button.gold{background:linear-gradient(135deg,#E4C77A,#C9A24B);color:var(--navy);font-weight:700;border:0}button.gold:hover{filter:brightness(1.08);background:linear-gradient(135deg,#E4C77A,#C9A24B)}
button.del{border-color:#ff7a7a;color:#ff9a9a}button.sm{padding:5px 11px;font-size:.82rem;border-radius:9px}button:disabled{opacity:.5;cursor:wait}
#login{max-width:380px;margin:14vh auto;padding:30px;background:var(--panel);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.4)}
#login .lg{height:44px;margin:0 auto;object-fit:contain}#login h1{margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;color:var(--gold2);font-size:2rem}#login #lerr{color:#ff9a9a;min-height:1em}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:20px 14px;background:rgba(11,19,48,.92);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;border-bottom:1px solid var(--line)}.brand img{height:30px}.brand b{color:var(--gold2);font-size:1.15rem;letter-spacing:.06em}.brand small{color:var(--mut);margin-left:auto;font-size:.7rem;text-transform:uppercase;letter-spacing:.14em}
#tabs{display:flex;flex-direction:column;gap:3px}.nv{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;border-radius:12px;padding:10px 12px}
.nv .ic{width:26px;text-align:center;font-size:1.1rem}.nv.on{background:linear-gradient(135deg,#E4C77A,#C9A24B);color:var(--navy);font-weight:700}
.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.stage{min-width:0}.hd{padding:28px 34px 6px;max-width:1080px;margin:0 auto}.hd h1{margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;color:var(--gold2);font-size:2.3rem;line-height:1.1}.hd p{margin:4px 0 0;color:var(--mut)}
main{max-width:1080px;margin:0 auto;padding:16px 34px 120px}
h3{margin:18px 0 8px;color:var(--gold2);font-weight:600}
.hint{color:var(--mut);font-size:.9rem;margin:0 0 14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.row>button,.row>.fx{flex:0 0 auto;min-width:0}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}.card small{color:var(--mut)}
.orig{color:var(--mut);font-size:.78rem;margin:2px 0 4px;white-space:pre-wrap}.tag{display:inline-block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-right:8px}
.thumb{width:84px;height:56px;object-fit:cover;border-radius:8px;background:#0b1330;border:1px solid var(--line);flex:0 0 auto}.blk{margin:8px 0 0 18px;padding-left:12px;border-left:2px solid var(--gold)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.pill{border-radius:99px;padding:6px 13px;font-size:.84rem}.pill.on{background:var(--gold);color:var(--navy);font-weight:700;border-color:var(--gold)}
.note{color:var(--mut);font-size:.9rem;flex:1}
.cgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.ci{display:flex;flex-direction:column;gap:9px;margin:0;cursor:grab}.ci.drag{opacity:.4}
.ciimg{position:relative}.big{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;background:#0b1330;border:1px solid var(--line);display:block}.badge{position:absolute;left:8px;top:8px;background:var(--gold);color:var(--navy);font-weight:800;border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-size:.8rem}
.addtile{min-height:200px;border:2px dashed rgba(201,162,75,.5);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--gold2)}.addtile b{font-size:2.4rem;line-height:1;font-weight:400}
#modal{position:fixed;inset:0;background:rgba(5,9,22,.78);backdrop-filter:blur(4px);z-index:60;display:grid;place-items:center;padding:20px}.mbox{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;width:min(860px,100%);max-height:88vh;overflow:auto}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.pick .pk{padding:0;border-radius:12px;overflow:hidden;aspect-ratio:3/2}.pick .pk img{width:100%;height:100%;object-fit:cover;display:block}.pick.big{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.mi{display:flex;flex-direction:column;gap:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:6px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}.stat b{display:block;font-size:1.2rem}.stat .ok{color:#4ADE80}.stat .ko{color:#ff9a9a}.stat small{color:var(--mut)}
.scs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.sc{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:16px;border-radius:16px;background:var(--panel)}.sc .ic{font-size:1.6rem}.sc:hover{transform:translateY(-3px);border-color:var(--gold)}
.fld{margin-bottom:12px}.fld label{display:block;font-weight:600;margin-bottom:5px}.fld small{display:block;color:var(--mut);margin-top:4px}.cnt.ok{color:#4ADE80!important}.cnt.warn{color:#ffb86b!important}
.gprev{background:#fff;border-radius:12px;padding:14px 16px;margin:6px 0 12px;font-family:Arial,sans-serif}.gt{color:#1a0dab;font-size:1.15rem;line-height:1.3}.gu{color:#006621;font-size:.8rem;margin:2px 0}.gd{color:#4d5156;font-size:.85rem}
.sbar{position:fixed;left:260px;right:0;bottom:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 34px;background:rgba(13,21,48,.96);border-top:1px solid var(--gold);transform:translateY(110%);transition:transform .3s;backdrop-filter:blur(8px)}.sbar.on{transform:none}.sbar span{color:var(--gold2)}.sbar div{display:flex;gap:10px}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);border-radius:12px;padding:10px 18px;opacity:0;pointer-events:none;transition:.3s;z-index:70;max-width:90vw}#toast.on{opacity:1}#toast.bad{border-color:#ff7a7a}
progress{width:100%;height:10px}.sw{width:30px;height:30px;border-radius:8px;border:1px solid #fff4;flex:0 0 auto}.msg.unread{border-color:var(--gold)}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:8px 10px;z-index:25;overflow-x:auto}.brand,.sfoot{display:none}#tabs{flex-direction:row;gap:4px}.nv{white-space:nowrap;padding:8px 11px}.hd{padding:18px 16px 4px}.hd h1{font-size:1.8rem}main{padding:12px 16px 120px}.sbar{left:0;padding:10px 16px}}

#view>h2{display:none}
</style>
</head>
<body>
<form id="login"><img class="lg" src="logo.png" alt=""><h1>Admin UIPACT</h1><small style="color:#9A9CAA">Connectez-vous pour modifier votre site.</small><input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required><button class="gold">Se connecter</button><small id="lerr"></small></form>
<div id="app" hidden>
  <div class="shell">
    <aside class="side"><div class="brand"><img src="logo.png" alt=""><b>UIPACT</b><small>Admin</small></div><nav id="tabs"></nav><div class="sfoot"><a href="index.html" target="_blank" rel="noopener">Voir le site ↗</a><button id="out">Se déconnecter</button></div></aside>
    <section class="stage"><header class="hd"><h1 id="vt"></h1><p id="vd"></p></header><main id="view"></main></section>
  </div>
  <div class="sbar" id="sbar"><span>● Modifications non enregistrées</span><div><button id="undo">Annuler</button><button class="gold" id="saveBtn">Enregistrer</button></div></div>
</div>
<div id="modal" hidden></div><div id="toast"></div>
<script>window.CMS_ADMIN = true;</script>
<script src="config.js"></script><script src="cms.js"></script>
<script>
(function () {
var API = String(window.UIPACT_API || '').replace(/\/$/, ''), C = window.CMS, $ = function (s) { return document.querySelector(s); };
var tok = sessionStorage.getItem('uipact_tok'), S = {}, tab = 'home', dirty = false;
var TABS = [['home', '🏠', 'Accueil', 'Vue d\u2019ensemble et raccourcis'], ['texts', '✏️', 'Textes', 'Modifier, masquer ou ajouter des textes'], ['images', '🖼️', 'Photos des pages', 'Remplacer les photos fixes de chaque page'],
  ['carousels', '🎠', 'Carrousels', 'Ajouter, supprimer et déplacer les photos des carrousels 3D'], ['media', '📁', 'Bibliothèque', 'Toutes vos photos envoyées'], ['colors', '🎨', 'Couleurs', 'La palette du site'],
  ['header', '🔝', 'Header', 'Le menu en haut des pages'], ['footer', '🔚', 'Footer', 'Le bas des pages'], ['seo', '🔍', 'SEO', 'Ce que Google et les réseaux sociaux affichent'],
  ['langs', '🌍', 'Langues', 'Traduire le site et ajouter des langues'], ['msgs', '✉️', 'Messages', 'Les messages du formulaire de contact']];
var LABEL = {}; TABS.forEach(function (t) { LABEL[t[0]] = t; });
var PAGE_NAMES = { index: 'Accueil', 'a-propos': 'À propos', portfolio: 'Portfolio', 'creation-graphique': 'Création graphique', 'creation-print': 'Création print', 'sites-web': 'Sites internet', 'identite-visuelle': 'Identité visuelle', 'ux-ui': 'UX / UI', contact: 'Contact', 'mentions-legales': 'Mentions légales', cgu: 'CGU', 'politique-confidentialite': 'Politique de confidentialité' };
var CARS = [['home', 'Accueil'], ['portfolio', 'Page Portfolio'], ['creation-graphique', 'Création graphique'], ['creation-print', 'Création print'], ['sites-web', 'Sites internet'], ['identite-visuelle', 'Identité visuelle'], ['ux-ui', 'UX / UI']];
var HOME = [['img/chene.png', 'Le Chêne Doré', 'Webdesign'], ['img/tout.png', 'Novaflow Advisory', 'Branding'], ['img/sport.png', 'Application Mobile', 'UX / UI design'], ['img/japan.png', 'Japan and Friends', 'Identité visuelle'], ['img/foodweb.png', 'Food Burger', 'Webdesign']];
var PORT = HOME.concat([['img/alpharun.png', 'AlphaRun', 'Mockup UI'], ['img/flyers-alpharun.png', 'Flyers AlphaRun', 'Print'], ['img/carte.png', 'Cartes de visite', 'Print']]);
function h(t, p) { var e = document.createElement(t); for (var k in p || {}) { if (k === 'class') e.className = p[k]; else if (k.slice(0, 2) === 'on') e[k] = p[k]; else if (k === 'value') e.value = p[k]; else e.setAttribute(k, p[k]); } [].slice.call(arguments, 2).forEach(function (c) { if (c == null) return; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); }); return e; }
function toast(m, bad) { var t = $('#toast'); t.textContent = m; t.className = 'on' + (bad ? ' bad' : ''); clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = ''; }, bad ? 6000 : 3200); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function bar() { $('#sbar').classList.toggle('on', dirty); }
function mark() { dirty = true; bar(); if (mark.pend) mark.pend(); }
async function api(path, o) {
  o = o || {}; o.headers = Object.assign({ Authorization: 'Bearer ' + tok }, o.headers || {});
  if (o.json) { o.body = JSON.stringify(o.json); o.method = o.method || 'POST'; o.headers['Content-Type'] = 'application/json'; }
  var r = await fetch(API + path, o), j = await r.json().catch(function () { return {}; });
  if (r.status === 401) { logout(); throw new Error(j.error || 'Session expirée'); }
  if (!r.ok) throw new Error(j.error || 'Erreur ' + r.status); return j;
}
function logout() { sessionStorage.removeItem('uipact_tok'); tok = null; $('#app').hidden = true; $('#login').hidden = false; }
$('#out').onclick = logout;
$('#login').onsubmit = async function (e) {
  e.preventDefault(); $('#lerr').textContent = '';
  try { var j = await fetch(API + '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#pw').value }) }).then(function (r) { return r.json().then(function (b) { if (!r.ok) throw new Error(b.error); return b; }); }); tok = j.token; sessionStorage.setItem('uipact_tok', tok); start(); }
  catch (x) { $('#lerr').textContent = /fetch/i.test(x.message) ? "Impossible de joindre l'API (vérifiez config.js, ou patientez 1 minute : le serveur se réveille)." : x.message; }
};
function norm() {
  ['texts', 'hidden', 'blocks', 'images', 'carousels', 'translations', 'langNames'].forEach(function (k) { S[k] = S[k] || {}; });
  S.seo = S.seo || {}; S.seo.site = S.seo.site || {}; S.seo.pages = S.seo.pages || {}; S.seo.schema = S.seo.schema || {};
  S.languages = S.languages && S.languages.length ? S.languages : ['fr'];
}
async function start() {
  $('#login').hidden = true; $('#app').hidden = false;
  try { S = await api('/api/settings'); } catch (e) { toast(e.message, true); return; }
  norm(); dirty = false; bar(); drawTabs(); show();
}
function go(k) { tab = k; drawTabs(); show(); }
function drawTabs() { var t = $('#tabs'); t.innerHTML = ''; TABS.forEach(function (x) { t.appendChild(h('button', { class: 'nv' + (x[0] === tab ? ' on' : ''), title: x[3], onclick: function () { go(x[0]); } }, h('span', { class: 'ic' }, x[1]), x[2])); }); }
$('#saveBtn').onclick = save;
$('#undo').onclick = function () { if (confirm('Annuler toutes les modifications non enregistrées ?')) start(); };
async function save() {
  for (var k in S.carousels) { if (!(S.carousels[k] || []).length) delete S.carousels[k]; }
  for (var k2 in S.carousels) if (S.carousels[k2].some(function (x) { return !x.image; })) { toast('Une photo du carrousel « ' + k2 + ' » est vide : cliquez sur « Changer la photo ».', true); return; }
  var b = $('#saveBtn'); b.disabled = true;
  try { S = await api('/api/settings', { method: 'PUT', json: S }); norm(); dirty = false; bar(); toast('Enregistré ✓ Le site se met à jour au prochain chargement des pages.'); }
  catch (e) { toast(e.message, true); }
  b.disabled = false;
}
addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
function show() {
  var v = $('#view'); v.innerHTML = ''; mark.pend = null; var t = LABEL[tab]; $('#vt').textContent = t[1] + '  ' + t[2]; $('#vd').textContent = t[3];
  ({ home: vHome, texts: vTexts, images: vImages, carousels: vCars, media: vMedia, colors: vColors, header: vHeader, footer: vFooter, seo: vSeo, langs: vLangs, msgs: vMsgs })[tab](v).catch(function (e) { toast(e.message, true); });
  window.scrollTo(0, 0);
}
async function pageDoc(p) { var r = await fetch(p + '.html'); if (!r.ok) throw new Error('Page introuvable : ' + p); return new DOMParser().parseFromString(await r.text(), 'text/html'); }
function pageSelect(cur, on) { var d = h('div', { class: 'pills' }); C.PAGES.forEach(function (p) { d.appendChild(h('button', { class: 'pill' + (p === cur ? ' on' : ''), onclick: function () { on(p); } }, PAGE_NAMES[p] || p)); }); return d; }
function tx(val, on, ph, rows) { var e = rows ? h('textarea', { rows: rows }) : h('input'); e.value = val == null ? '' : val; if (ph) e.placeholder = ph; e.oninput = function () { on(e.value); mark(); }; return e; }
function fld(label, el, help) { return h('div', { class: 'fld' }, h('label', {}, label), el, help ? h('small', {}, help) : null); }
function askUrl(cb) { var u = prompt("Adresse (URL) de l'image — https://… ou img/mon-image.png"); if (u && u.trim()) cb(u.trim()); }

/* ---------------- Envoi et choix de photos ---------------- */
async function shrink(f) {
  if (!/^image\/(jpeg|png|webp)$/.test(f.type) || f.size < 500 * 1024) return f;
  try {
    var bm = await createImageBitmap(f), s = Math.min(1, 1800 / Math.max(bm.width, bm.height)), c = document.createElement('canvas'); c.width = Math.round(bm.width * s); c.height = Math.round(bm.height * s); c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
    var b = await new Promise(function (r) { c.toBlob(r, 'image/webp', .86); });
    return b && b.size < f.size ? new File([b], f.name.replace(/\.\w+$/, '') + '.webp', { type: 'image/webp' }) : f;
  } catch (e) { return f; }
}
async function sendFile(f) { f = await shrink(f); var fd = new FormData(); fd.append('file', f); return (await api('/api/upload', { method: 'POST', body: fd })).url; }
function uploadFile(cb) {
  var i = h('input', { type: 'file', accept: 'image/*,video/mp4,video/webm' });
  i.onchange = async function () { if (!i.files[0]) return; try { toast('Envoi en cours…'); var u = await sendFile(i.files[0]); cb(u); toast('Photo envoyée ✓'); } catch (e) { toast(e.message, true); } };
  i.click();
}
function closeModal() { var m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
async function pickImage(cb) {
  var m = $('#modal'); m.hidden = false; m.innerHTML = ''; var box = h('div', { class: 'mbox' }); m.appendChild(box); m.onclick = function (e) { if (e.target === m) closeModal(); };
  var seen = {}, mine = h('div', { class: 'pick' }), site = h('div', { class: 'pick' });
  function add(g, url) { if (!url || seen[url]) return; seen[url] = 1; g.appendChild(h('button', { class: 'pk', onclick: function () { closeModal(); cb(url); } }, h('img', { src: url, loading: 'lazy', alt: '' }))); }
  var u = h('input', { placeholder: '… ou collez une adresse (https://… ou img/photo.png)' });
  box.appendChild(h('div', { class: 'row', style: 'margin-bottom:12px' }, h('b', { style: 'flex:1;font-size:1.15rem' }, 'Choisir une image'), h('button', { onclick: closeModal }, 'Fermer')));
  box.appendChild(h('div', { class: 'row' }, h('button', { class: 'gold', onclick: function () { uploadFile(function (x) { closeModal(); cb(x); }); } }, '📁 Envoyer depuis mon ordinateur'), u, h('button', { onclick: function () { var x = u.value.trim(); if (x) { closeModal(); cb(x); } } }, 'Utiliser cette adresse')));
  box.appendChild(h('h3', {}, 'Mes photos envoyées')); box.appendChild(mine); box.appendChild(h('h3', {}, 'Photos du site')); box.appendChild(site);
  PORT.forEach(function (x) { add(site, x[0]); }); add(site, 'logo.png'); Object.keys(S.carousels).forEach(function (k) { (S.carousels[k] || []).forEach(function (x) { add(site, x.image); }); });
  try { (await api('/api/media')).forEach(function (x) { add(mine, x.url); }); } catch (e) { /* pas de base : on garde seulement les photos du site */ }
  if (!mine.children.length) mine.appendChild(h('p', { class: 'hint' }, 'Rien d\u2019envoyé pour l\u2019instant.'));
}
function imgButtons(cb) { return [h('button', { class: 'sm gold', onclick: function () { pickImage(cb); } }, '🖼️ Changer la photo'), null]; }

/* ---------------- Accueil ---------------- */
async function vHome(v) {
  var st = h('div', { class: 'stats' }), s1 = h('div', { class: 'stat' }, h('small', {}, 'Serveur et base de données'), h('b', {}, 'Vérification…')), s2 = h('div', { class: 'stat' }, h('small', {}, 'Messages non lus'), h('b', {}, '…'));
  st.appendChild(s1); st.appendChild(s2);
  st.appendChild(h('div', { class: 'stat' }, h('small', {}, 'Langues proposées'), h('b', {}, String(S.languages.length) + (S.languages.length > 1 ? ' langues' : ' langue'))));
  v.appendChild(st);
  fetch(API + '/api/health').then(function (r) { return r.json(); }).then(function (j) { s1.lastChild.className = j.db ? 'ok' : 'ko'; s1.lastChild.textContent = j.db ? '● En ligne' : '● Base injoignable'; if (!j.db) s1.appendChild(h('small', {}, j.dbError || '')); }).catch(function () { s1.lastChild.className = 'ko'; s1.lastChild.textContent = '● Serveur injoignable'; });
  api('/api/messages').then(function (m) { var n = m.filter(function (x) { return !x.read; }).length; s2.lastChild.textContent = String(n); if (n) s2.lastChild.className = 'ok'; }).catch(function () { s2.lastChild.textContent = '—'; });
  v.appendChild(h('h3', {}, 'Que voulez-vous faire ?'));

function lname(l) { return S.langNames[l] || C.LANGS[l] || PRESET[l] || l.toUpperCase(); }
async function vLangs(v) {
  v.appendChild(h('p', { class: 'hint' }, 'Le français est la langue d\u2019origine. Ajoutez une langue, cliquez sur « Traduire » (traduction automatique de tous les textes), puis « Enregistrer ». Relancez « Traduire » après avoir modifié des textes. Les visiteurs voient un sélecteur de langue dans le menu.'));
  var present = S.languages.filter(function (l) { return l !== 'fr'; }); Object.keys(S.translations).forEach(function (l) { if (present.indexOf(l) < 0 && l !== 'fr') present.push(l); });
  var sel = h('select'), codeI = h('input', { placeholder: 'Code (ex. ar, ja, pt-br)', maxlength: '8' }), nameI = h('input', { placeholder: 'Nom affiché (ex. Japonais)' }), custom = h('div', { class: 'row', hidden: '' }, codeI, nameI);
  Object.keys(PRESET).forEach(function (l) { if (present.indexOf(l) < 0) sel.appendChild(h('option', { value: l }, PRESET[l] + ' (' + l + ')')); });
  sel.appendChild(h('option', { value: '__other' }, 'Autre langue (saisir le code)…')); sel.onchange = function () { custom.hidden = sel.value !== '__other'; };
  v.appendChild(h('div', { class: 'card' }, h('b', {}, '➕ Ajouter une langue'), h('div', { class: 'row', style: 'margin-top:8px' }, sel, h('button', { class: 'gold', onclick: function () {
    var l = sel.value, nm = '';
    if (l === '__other') { l = codeI.value.trim().toLowerCase(); nm = nameI.value.trim(); if (!/^[a-z]{2,3}(-[a-z]{2,4})?$/.test(l)) { toast('Code de langue invalide (exemples : ar, ja, pt-br).', true); return; } if (!nm) { toast('Indiquez le nom affiché de la langue.', true); return; } }
    if (l === 'fr' || S.languages.indexOf(l) > -1) { toast('Cette langue est déjà ajoutée.', true); return; }
    S.languages.push(l); if (nm) S.langNames[l] = nm; else if (!C.LANGS[l]) S.langNames[l] = PRESET[l] || l; mark(); show();
  } }, 'Ajouter')), custom));
  if (!present.length) v.appendChild(h('p', { class: 'hint' }, 'Aucune langue ajoutée pour le moment.'));
  present.forEach(function (l) {
    var ck = h('input', { type: 'checkbox' }); ck.checked = S.languages.indexOf(l) > -1;
    ck.onchange = function () { var i = S.languages.indexOf(l); if (ck.checked && i < 0) S.languages.push(l); if (!ck.checked && i > -1) S.languages.splice(i, 1); if (S.languages.indexOf('fr') < 0) S.languages.unshift('fr'); mark(); };
    var n = Object.keys(S.translations[l] || {}).length, pr = h('progress', { value: 0, max: 1, hidden: '' }), log = h('small', {}, n ? n + ' textes traduits' : 'Pas encore traduit');
    var go2 = h('button', { class: 'gold', onclick: async function () {
      go2.disabled = true; pr.hidden = false; log.textContent = 'Lecture des pages…';
      try {
        var map = await collect(), ids = Object.keys(map), uniq = {}, out = {}; ids.forEach(function (id) { (uniq[map[id]] = uniq[map[id]] || []).push(id); });
        var texts = Object.keys(uniq), done = 0, batch = [], size = 0, errs = [];
        async function flush() { if (!batch.length) return; var r = await api('/api/translate', { json: { from: 'fr', to: l, texts: batch } }); if (r.errors && r.errors.length) errs = r.errors; batch.forEach(function (t, i) { uniq[t].forEach(function (id) { out[id] = r.texts[i]; }); }); done += batch.length; pr.value = done / texts.length; log.textContent = done + ' / ' + texts.length + ' textes…'; batch = []; size = 0; }
        for (var i = 0; i < texts.length; i++) { if (batch.length >= 60 || size + texts[i].length > 9000) await flush(); batch.push(texts[i]); size += texts[i].length; } await flush();
        S.translations[l] = out; if (S.languages.indexOf(l) < 0) { S.languages.push(l); ck.checked = true; } mark(); await save(); log.textContent = Object.keys(out).length + ' textes traduits ✓' + (errs.length ? ' — ' + errs.join(' · ') : '');
      } catch (e) { log.textContent = '⚠ ' + e.message; toast(e.message, true); }
      go2.disabled = false;
    } }, 'Traduire');
    v.appendChild(h('div', { class: 'card' }, h('div', { class: 'row' }, h('label', { class: 'fx', style: 'font-weight:600' }, ck, ' ' + lname(l) + ' (' + l + ')'), go2,
      h('a', { href: 'index.html?lang=' + l, target: '_blank', rel: 'noopener', style: 'flex:0 0 auto' }, 'Voir le site ↗'),
      h('button', { class: 'sm', onclick: function () { delete S.translations[l]; mark(); show(); } }, 'Effacer la traduction'),
      h('button', { class: 'sm del', onclick: function () { if (!confirm('Retirer cette langue du site ?')) return; S.languages = S.languages.filter(function (x) { return x !== l; }); delete S.translations[l]; delete S.langNames[l]; mark(); show(); } }, 'Retirer')), pr, log));
  });
}

async function collect() {
  var map = {}; function add(id, t) { t = (t || '').trim(); if (t && /\p{L}/u.test(t)) map[id] = t; }
  for (var pi = 0; pi < C.PAGES.length; pi++) {
    var p = C.PAGES[pi], doc = await pageDoc(p).catch(function () { return null; }); if (!doc) continue; var T = S.texts[p] || {}, hid = S.hidden[p] || [];
    C.scan(doc).forEach(function (s) { if (s.chrome || hid.indexOf(s.key) > -1) return; s.nodes.forEach(function (nd) { var k = s.key + '_' + nd.i; add(p + '__' + k, T[k] != null ? T[k] : nd.node.nodeValue); }); });
    (S.blocks[p] || []).forEach(function (b) { add(p + '__b' + b.id, b.text); });
    add('seo_' + p + '_t', (S.seo.pages[p] || {}).title || doc.title); add('seo_' + p + '_d', (S.seo.pages[p] || {}).description || (doc.querySelector('meta[name="description"]') || {}).content);
  }
  add('seo_site_d', S.seo.site.description);
  var H = C.merge(C.DEF.header, S.header || {}), F = C.merge(C.DEF.footer, S.footer || {}), cols = (S.footer && S.footer.columns) || C.DEF.footer.columns;
  (H.items || []).forEach(function (l, i) { add('hdr_i' + i, l.label); }); (H.dropdown || []).forEach(function (l, i) { add('hdr_d' + i, l.label); }); add('hdr_cta', H.cta.label);
  add('ftr_tag1', F.tag1); add('ftr_tag2', F.tag2); add('ftr_follow', F.follow); add('ftr_lucky', F.lucky); add('ftr_copy', F.copyright); add('ftr_sig', F.signature);
  cols.forEach(function (c, i) { add('ftr_c' + i + '_t', c.title); (c.links || []).forEach(function (l, j) { add('ftr_c' + i + '_l' + j, l.label); }); });
  Object.keys(S.carousels).forEach(function (k) { (S.carousels[k] || []).forEach(function (x, i) { add('car_' + k + '_' + i + '_t', x.title); add('car_' + k + '_' + i + '_s', x.subtitle); }); });
  return map;
}
/* ---------------- Messages ---------------- */
async function vMsgs(v) {
  v.appendChild(h('h2', {}, 'Messages reçus')); var list = h('div'); v.appendChild(list);
  var ms = await api('/api/messages'); if (!ms.length) list.appendChild(h('p', { class: 'hint' }, 'Aucun message pour l\u2019instant.'));
  ms.forEach(function (m) {
    list.appendChild(h('div', { class: 'card msg' + (m.read ? '' : ' unread') }, h('div', { class: 'row' }, h('b', {}, m.name), h('a', { href: 'mailto:' + m.email }, m.email), h('small', {}, new Date(m.createdAt).toLocaleString('fr-FR')), h('button', { class: 'sm', onclick: async function () { await api('/api/messages/' + m._id, { method: 'PUT', json: { read: !m.read } }); show(); } }, m.read ? 'Marquer non lu' : 'Marquer lu'), h('button', { class: 'sm del', onclick: async function () { if (confirm('Supprimer ce message ?')) { await api('/api/messages/' + m._id, { method: 'DELETE' }); show(); } } }, 'Supprimer')), h('p', { style: 'white-space:pre-wrap;margin:8px 0 0' }, m.message)));
  });
}
